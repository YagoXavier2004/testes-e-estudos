<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos</title>
    <link rel="stylesheet" href="style/style.css"> <!-- Feito o caminho da pasta estilo até o codigo css3-->
</head>
<body>
    <header class="topo-cabecalho"> <!-- <header> • Cabeçalho do Site (Logotipo, Título e Apresentação) -->

        <!-- <header> • CABEÇALHO
        
        O que é e para que serve:
        
        • Agrupa a introdução ou navegação da página inteira ou de uma
        seção específica;
        
        • Normalmente contém: logotipo, título principal <h1>, slogan e
        barra de busca;
        
        • Pode aparecer no topo da página e também no topo de cada
        <article>.-->


        <nav class="links"> <!-- <nav> • Menu de Links -->

            <!-- <nav> • BARRA DE NAVEGAÇÃO
            
            O que é e para que serve:
            
            • Indica expressamente que o bloco contém os links principais de
            navegação do site;
            
            • Não é para qualquer link! Use apenas para menus estruturais
            (Home, Sobre, Contato);
            
            • Leitores de tela possuem atalho direto para saltar até a tag <nav>.-->

        </nav>
    </header>
    <main class="menu-principal"> <!-- <main> • Conteúdo Principal Exclusivo da Página (Único por página!)-->

        <!-- <main> • CONTEÚDO PRINCIPAL
        
        Regra de Ouro Inegociável:
        
        • Envolve o conteúdo dominante e exclusivo da página atual;
        
        • Deve existir rigorosamente APENAS UM <main> por página HTML!
        
        • NUNCA coloque cabeçalhos globais, rodapés ou menus fixos
        dentro do <main>.-->
        <section class="secao"> <!-- <section> • Seção Temática (ex: Notícias Recentes)-->

            <!-- <section> • SEÇÃO TEMÁTICA
            
            Quando e por que utilizar:
            
            • Agrupa um bloco de conteúdo que possui uma temática comum
            dentro do documento;
            
            • Boa prática: praticamente toda <section> deve possuir seu
            próprio título (h2, h3);
            
            • Exemplos clássicos: Seção 'Sobre Nós', Seção 'Serviços', Seção
            'Contato'.-->

        </section> 
    </main>
    <footer class="rodape"> <!-- <footer> • Rodapé da Página (Direitos Autorais © 2026, Contatos, Políticas de Privacidade e Redes)-->

        <!-- O PAPEL DO RODAPÉ (FOOTER)
        
        O que colocar dentro de um <footer>:
        
        1. Direitos Autorais e Copyright (&copy; 2026 Nome da Empresa);
        
        2. Links de Políticas de Privacidade e Termos de Uso;
        
        3. Informações de contato: e-mail institucional, telefone e endereço físico;
        
        4. Links para redes sociais oficiais (LinkedIn, GitHub, Instagram);
        
        5. Mapa do site ou links rápidos secundários.
        
        Importante: Assim como o <header>, o <footer> pode aparecer no final da
        página inteira OU no final de um <article> específico!-->

    </footer>
    
</body>
</html>
